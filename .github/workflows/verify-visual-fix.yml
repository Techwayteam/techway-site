name: Verify hero quality and blog design (no deploy)

on:
  push:
    branches: [fix/hero-resolucao-blog-visual]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: node --check scripts/verify-live-site.cjs
      - run: npm run build
      - run: npm run verify-seo
      - run: npm run verify-contacts
      - run: node scripts/verify-home-copy.cjs
      - run: node scripts/verify-visual-fix.cjs
      - name: Prepare browser verification
        run: |
          npm install --prefix /tmp/techway-browser --no-save --package-lock=false playwright@1.56.1
          /tmp/techway-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify navigation and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 4173 >/tmp/techway-visual.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; tail -n 40 /tmp/techway-visual.log' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          NODE_PATH=/tmp/techway-browser/node_modules node scripts/verify-browser-attribution.cjs
          NODE_PATH=/tmp/techway-browser/node_modules node scripts/capture-visual-fix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-fix-desktop-mobile
          path: artifacts/visual-fix/
          retention-days: 14
          if-no-files-found: warn
