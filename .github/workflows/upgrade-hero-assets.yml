name: Generate higher-quality hero assets (one time)

on:
  push:
    branches: [fix/hero-resolucao-blog-visual]

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[generate assets]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 2x source images locally
        run: |
          python -m pip install Pillow==12.0.0
          python scripts/upgrade-hero-assets.py
      - name: Commit binary assets to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/illustrations/techway-empreendedora-hq.webp public/illustrations/techway-assistente-hq.webp
          git diff --cached --exit-code && exit 0 || true
          git commit -m "assets(site): substituir hero comprimida por versões 2x WebP"
          git pull --rebase origin fix/hero-resolucao-blog-visual
          git push origin HEAD:fix/hero-resolucao-blog-visual
