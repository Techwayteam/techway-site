name: Validate T021 on feature branch

on:
  push:
    branches:
      - feat/t021-blog-oferta-origem

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build, SEO, and contact attribution checks
        run: npm run build
      - name: Verify SEO independently
        run: npm run verify-seo
      - name: Verify contacts independently
        run: npm run verify-contacts
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA - local server only, no deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 4173 > /tmp/techway-t021-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; tail -n 120 /tmp/techway-t021-next.log' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node scripts/verify-browser-attribution.cjs
